<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Food History - MealCampus</title>

    <link
        rel="stylesheet"
        href="/css/food-history.css"
    >

</head>


<body>

    <div class="history-container">

        <!-- HEADER -->

        <header class="history-header">

            <div>

                <h1>MealCampus</h1>

                <p>
                    Your Food History
                </p>

            </div>

            <a href="/dashboard.html">
                ← Dashboard
            </a>

        </header>


        <!-- INTRO -->

        <section class="history-intro">

            <h2>
                Food History 🍽️
            </h2>

            <p>
                View the foods you have logged
                and their nutritional information.
            </p>

        </section>


        <!-- HISTORY -->

        <section class="history-section">

            <h2>
                Recent Food Logs
            </h2>

            <div
                id="historyContainer"
                class="history-list"
            >

                <p class="loading">
                    Loading your food history...
                </p>

            </div>

        </section>

    </div>


    <script src="/js/food-history.js"></script>

</body>

</html>
