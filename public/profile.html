<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="profile-container">
    <div class="profile-box">
    <h1>MealCampus</h1>
    <h2>Tell Us About Yourself</h2>
    <p> We'll use this information to calculate your daily nutrition needs.</p>
    <form id="profileForm">
    
    <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="Enter your age" min="1" max="100" required>
    </div>

    <div class="form-group">
       <label for="gender">Gender</label>
       <select id="gender" name="gender" required>
<option value="">Select Gender</option>   
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Prefer not to say</option>        
       </select>
    </div>

    <div class="form-group">
        <label for="height">Height (cm)</label>
          <input
                        type="number"
                        id="height"
                        name="height"
                        placeholder="Enter your height"
                        min="50"
                        max="250"
                        step="0.1"
                        required>
    </div>

    <div class="form-group">
         <label for="weight">Weight (kg)</label>
         <input type="number" id="weight" name="weight" placeholder="Enter your weight" min="20" max="300" step="0.1" required>
    </div>

  <div class="form-group">
<label for="activityLevel">Activity Level</label>
    <select id="activityLevel" name="activityLevel" required>
     <option value="">
    Select Activity Level
    </option>

    <option value="sedentary">
    Sedentary - Little or no exercise
    </option>

    <option value="light">
    Lightly Active - 1-3 days/week
    </option>

    <option value="moderate">
    Moderately Active - 3-5 days/week
    </option>

    <option value="very_active">
    Very Active - 6-7 days/week
    </option>

    <option value="extra_active">
    Extra Active - Very intense activity
    </option>
    </select>
                    
<!-- Diet Preference -->
<div class="form-group goal-group">

    <label for="dietPreference">
        Diet Preference
    </label>

    <select
        id="dietPreference"
        name="dietPreference"
        required
    >
    <option value="">
            Select Diet Preference
        </option>

        <option value="vegetarian">
            Vegetarian
        </option>

        <option value="non-vegetarian">
            Non-Vegetarian
        </option>

        <option value="eggetarian">
            Eggetarian
        </option>

        <option value="vegan">
            Vegan
        </option>

    </select>

</div>
<button type="submit">Continue</button>
    

</form>
</div>
</div>
<script src="/js/profile.js"></script>
</body>
</html>
